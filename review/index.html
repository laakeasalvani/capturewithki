<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Required on every client page by CLAUDE.md rule 8. -->
<script src="../cms/no-indexeddb.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leave a review — CaptureWithKi</title>
<!-- Khiara sends this link to clients; it has no reason to appear in search. -->
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Share your experience with Khiara and CaptureWithKi.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="CaptureWithKi">
<meta property="og:url" content="https://capturewithki.com/review/">
<meta property="og:title" content="How was your experience with CaptureWithKi?">
<meta property="og:description" content="It only takes a minute, and it means the world to Khiara.">
<meta property="og:image" content="https://capturewithki.com/images/link-preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%236E7C5C'/%3E%3Ctext x='32' y='46' font-family='Georgia,serif' font-style='italic' font-size='40' fill='%23F2ECE0' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --cream:#E8DFCE; --bg:#F2ECE0; --paper:#FAF6EE; --ink:#171614;
  --muted:#6B6560; --line:#DCD0BC; --khaki:#6E7C5C; --khaki-dark:#596549; --gold:#B8862F;
  --display:"Cormorant Garamond","Times New Roman",serif;
  --sans:"Jost","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;}
[hidden]{display:none !important;}
html,body{height:100%;}
body{
  margin:0;background:var(--ink);color:var(--ink);
  font-family:var(--sans);font-weight:300;font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
/* A fixed element, not background-attachment:fixed, which iOS Safari ignores. */
.photo{
  position:fixed;inset:0;z-index:0;
  background:url(background.jpg) center 35%/cover no-repeat;
}
.photo::after{content:"";position:absolute;inset:0;background:rgba(23,22,20,.38);}
.stage{
  position:relative;z-index:1;min-height:100%;
  display:flex;align-items:center;justify-content:center;
  padding:24px 16px;
}
.card{
  position:relative;width:100%;max-width:440px;background:var(--paper);border-radius:14px;
  padding:clamp(26px,6vw,38px) clamp(20px,6vw,34px);text-align:center;
  box-shadow:0 22px 60px rgba(0,0,0,.4);
}
.back{
  position:absolute;top:12px;left:10px;width:44px;height:44px;padding:0;
  display:flex;align-items:center;justify-content:center;
  background:none;border:0;border-radius:8px;color:var(--khaki-dark);cursor:pointer;
}
.back:hover{background:var(--bg);}
.mark{
  display:block;font-family:var(--display);font-style:italic;font-size:22px;
  color:var(--khaki-dark);text-decoration:none;margin-bottom:14px;
}
h1{font-family:var(--display);font-weight:300;font-size:clamp(30px,8vw,38px);line-height:1.15;margin:0 0 10px;outline:none;}
.copy{color:var(--muted);margin:0 0 20px;}
.stars{color:var(--gold);font-size:30px;letter-spacing:5px;line-height:1;margin:6px 0 22px;}
.btn{
  display:block;width:100%;min-height:50px;padding:13px 22px;border:0;border-radius:8px;
  background:var(--khaki-dark);color:var(--paper);font:400 14px/1.5 var(--sans);
  letter-spacing:.14em;text-transform:uppercase;text-decoration:none;text-align:center;cursor:pointer;
}
.btn:hover{background:#4d583f;}
.btn[disabled]{opacity:.65;cursor:default;}
:focus-visible{outline:2px solid var(--khaki-dark);outline-offset:2px;}
/* Headings take focus from script when the screen changes; they are not controls. */
h1:focus-visible{outline:none;}

.rates{list-style:none;margin:0;padding:0;display:grid;gap:8px;}
.rate{
  display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:52px;
  padding:10px 16px;background:#fff;border:1px solid var(--line);border-radius:8px;
  font:300 15px/1.4 var(--sans);color:var(--ink);cursor:pointer;
}
.rate:hover{border-color:var(--khaki);background:var(--bg);}
.rate-stars{color:var(--gold);font-size:19px;letter-spacing:2px;}

form{text-align:left;margin:0;}
label{display:block;font-weight:400;font-size:14px;margin:0 0 14px;}
input,textarea{
  display:block;width:100%;margin-top:5px;padding:11px 12px;background:#fff;color:var(--ink);
  border:1px solid var(--line);border-radius:8px;font:300 16px/1.5 var(--sans);
}
textarea{min-height:120px;resize:vertical;}
.trap{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;}
.error{color:#8a2f2f;background:#fdf3f3;border-radius:6px;padding:9px 12px;font-size:14px;margin:0 0 14px;}
.alt{margin:18px 0 0;padding-top:16px;border-top:1px solid var(--line);font-size:14px;color:var(--muted);text-align:center;}
.alt a{color:var(--khaki-dark);text-underline-offset:3px;}
@media (prefers-reduced-motion:no-preference){
  .step{animation:rise .3s ease-out;}
  @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
}
</style>
</head>
<body>
<div class="photo" aria-hidden="true"></div>
<main class="stage">
  <div class="card">
    <button class="back" id="backBtn" type="button" aria-label="Back to the star ratings" hidden>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    </button>
    <a class="mark" href="/">CaptureWithKi</a>

    <section class="step" id="stepStart">
      <h1 tabindex="-1">Review us on Google</h1>
      <div class="stars" aria-hidden="true">&#9733;&#9733;&#9733;&#9733;&#9733;</div>
      <button class="btn" type="button" id="startBtn">Leave us a review</button>
      <noscript><p class="alt"><a href="https://search.google.com/local/writereview?placeid=ChIJu18zRqM4co8RuKeBOT8353g">Leave a review on Google</a></p></noscript>
    </section>

    <section class="step" id="stepRate" hidden>
      <h1 tabindex="-1">How would you rate us?</h1>
      <p class="copy">Thank you for trusting me with your photos.</p>
      <ul class="rates">
        <li><button class="rate" type="button" data-rating="5"><span class="rate-stars" aria-hidden="true">&#9733;&#9733;&#9733;&#9733;&#9733;</span>5 stars</button></li>
        <li><button class="rate" type="button" data-rating="4"><span class="rate-stars" aria-hidden="true">&#9733;&#9733;&#9733;&#9733;</span>4 stars</button></li>
        <li><button class="rate" type="button" data-rating="3"><span class="rate-stars" aria-hidden="true">&#9733;&#9733;&#9733;</span>3 stars</button></li>
        <li><button class="rate" type="button" data-rating="2"><span class="rate-stars" aria-hidden="true">&#9733;&#9733;</span>2 stars</button></li>
        <li><button class="rate" type="button" data-rating="1"><span class="rate-stars" aria-hidden="true">&#9733;</span>1 star</button></li>
      </ul>
    </section>

    <section class="step" id="stepFeedback" hidden>
      <h1 tabindex="-1">I'm sorry to hear that</h1>
      <p class="copy">Tell me what happened and I'll do my best to make it right.</p>
      <form id="feedbackForm" novalidate>
        <label>Name<input id="fName" name="name" type="text" autocomplete="name" maxlength="200" required></label>
        <label>Email<input id="fEmail" name="email" type="email" autocomplete="email" maxlength="320" required></label>
        <label>Your feedback<textarea id="fMessage" name="message" maxlength="5000" required></textarea></label>
        <!-- For bots only. Not named like anything a browser would autofill. -->
        <div class="trap" aria-hidden="true"><label>Leave empty<input id="fTrap" type="text" tabindex="-1" autocomplete="off"></label></div>
        <p class="error" id="fError" role="alert" hidden></p>
        <button class="btn" type="submit" id="fSend">Send feedback</button>
      </form>
    </section>

    <section class="step" id="stepSent" hidden>
      <h1 tabindex="-1">Thank you</h1>
      <p class="copy">Khiara has your message and will reach out to you by email.</p>
    </section>
  </div>
</main>

<script>
(function () {
  'use strict';
  var ENDPOINT = 'https://us-west1-capturewithki-69dd3.cloudfunctions.net/submitReviewFeedback';
  var OWNER_EMAIL = 'capturewithki@gmail.com';
  var GOOGLE_REVIEW_URL = 'https://search.google.com/local/writereview?placeid=ChIJu18zRqM4co8RuKeBOT8353g';
  var SEND_DEADLINE_MS = 20000;

  var renderedAt = Date.now();
  var rating = 0;
  var steps = ['stepStart', 'stepRate', 'stepFeedback', 'stepSent'];
  var $ = function (id) { return document.getElementById(id); };

  function show(id) {
    steps.forEach(function (s) { $(s).hidden = s !== id; });
    $('backBtn').hidden = id !== 'stepFeedback';
    $(id).querySelector('h1').focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }

  $('startBtn').addEventListener('click', function () { show('stepRate'); });
  $('backBtn').addEventListener('click', function () { show('stepRate'); });

  document.querySelectorAll('[data-rating]').forEach(function (b) {
    b.addEventListener('click', function () {
      rating = Number(b.getAttribute('data-rating'));
      if (rating >= 4) {
        location.href = GOOGLE_REVIEW_URL;
      } else {
        show('stepFeedback');
      }
    });
  });

  function fail(msg) {
    $('fError').textContent = msg;
    $('fError').hidden = false;
    $('fSend').disabled = false;
    $('fSend').textContent = 'Send feedback';
  }

  $('feedbackForm').addEventListener('submit', function (e) {
    e.preventDefault();
    $('fError').hidden = true;
    var name = $('fName').value.trim();
    var email = $('fEmail').value.trim();
    var message = $('fMessage').value.trim();
    if (!name) { fail('Please add your name.'); $('fName').focus(); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { fail('Please add a valid email so Khiara can reply.'); $('fEmail').focus(); return; }
    if (!message) { fail('Please add your feedback.'); $('fMessage').focus(); return; }

    $('fSend').disabled = true;
    $('fSend').textContent = 'Sending…';

    // Any wait a client can see needs a deadline and an honest message (CLAUDE.md).
    var ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, SEND_DEADLINE_MS);
    fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal: ctl.signal,
      body: JSON.stringify({
        rating: rating, name: name, email: email, message: message,
        honeypot: $('fTrap').value, renderedAt: renderedAt
      })
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (body) {
        if (res.ok && body.ok) { show('stepSent'); return; }
        fail(body.error || 'That did not send. Please try again, or email ' + OWNER_EMAIL + '.');
      });
    }).catch(function () {
      fail('That did not send. Your message is still here, so please try again, or email ' + OWNER_EMAIL + '.');
    }).then(function () { clearTimeout(timer); });
  });
})();
</script>
</body>
</html>
